<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlcBridge API 文档</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; overflow: hidden; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; padding: 0; }
    #swagger-ui { height: 100vh; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script>
    window.addEventListener('load', function() {
      // 注意：swagger-ui-dist@5.x 的 swagger-ui-bundle.js **不包含** StandalonePreset
      // （它在 swagger-ui-standalone-preset.js 里，是另一个包）。
      // 直接引用 SwaggerUIBundle.SwaggerUIStandalonePreset 会得到 undefined，
      // Swagger UI 随后抛出 "No layout defined for \"StandaloneLayout\""，页面只剩一行报错。
      //
      // 修复：改用 base preset（它自带默认 layout），不再声明 layout: 'StandaloneLayout'。
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        validatorUrl: '', // 禁用在线校验，避免 CORS
        persistAuthorization: true,
        displayRequestDuration: true,
        tryItOutEnabled: false,
        supportedSubmitMethods: ['get', 'post', 'put', 'delete'],
      })
    })
  </script>
</body>
</html>
